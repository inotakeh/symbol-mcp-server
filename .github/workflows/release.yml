name: Release (npm trusted publishing)

# A human creates the tag (v1.2.3). The agent is blocked from creating tags.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub Environment with "Required reviewers" = you. The job pauses until you approve in the UI.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # OIDC for npm trusted publishing (no NPM_TOKEN anywhere)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match package.json version $ver"; exit 1
          fi
      - name: Publish
        run: npm publish --access public --provenance

  # GitHub Release for the tag, with the CHANGELOG.md section of that version as notes. Runs only
  # after publish (and therefore the npm-publish approval) succeeded. If it fails, the package is
  # already on npm; rerun this job or create the release by hand with the same two commands.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --title "$GITHUB_REF_NAME"
