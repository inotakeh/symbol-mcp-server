name: Release (npm trusted publishing)

# A human creates the tag (v1.2.3). The agent is blocked from creating tags.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub Environment with "Required reviewers" = you. The job pauses until you approve in the UI.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # OIDC for npm trusted publishing (no NPM_TOKEN anywhere)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # registry-url as in npm's trusted publishing guide (also what OpenSSF Scorecard's Packaging
      # check looks for). No NODE_AUTH_TOKEN is set: npm exchanges the OIDC token at publish time.
      # No dependency cache in release builds (npm's guide).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # First, before anything is installed or published (scripts/release-check.mjs): the tag's
      # version is in package.json, package-lock.json and server.json, server.json names this npm
      # package and its mcpName, and CHANGELOG.md has the version's notes. A version on npm cannot
      # be changed, and the MCP Registry accepts it only with server.json's name as its mcpName.
      - name: Release files must match the tag
        run: node scripts/release-check.mjs "${GITHUB_REF_NAME#v}"
      # Trusted publishing needs npm >= 11.5.1, which Node 24 bundles. Fail instead of installing
      # an unpinned npm@latest.
      - name: npm must be 11.5.1 or newer
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"; exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish
        run: npm publish --access public --provenance

  # GitHub Release for the tag, with the CHANGELOG.md section of that version as notes and, as
  # assets, the tarball npm serves plus npm's provenance bundle for it (scripts/release-assets.sh,
  # which maintainers also use to backfill older releases) and the Claude Desktop bundle built from
  # that same tarball (scripts/build-mcpb.sh), which gets a GitHub build provenance attestation.
  # Runs only after publish (and therefore the npm-publish approval) succeeded. If it fails, the
  # package is already on npm; rerun this job or create the release by hand with the same commands.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release and upload its assets
      id-token: write       # OIDC token for the Sigstore certificate of the .mcpb attestation
      attestations: write   # store that attestation so `gh attestation verify` finds it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
      - name: Tarball and provenance bundle from npm
        run: bash scripts/release-assets.sh "${GITHUB_REF_NAME#v}" assets
      # Built from that tarball and this commit's package-lock.json only (npm ci --omit=dev in a
      # staging directory); the repository itself is not installed.
      - name: Claude Desktop bundle (.mcpb) from that tarball
        run: bash scripts/build-mcpb.sh "${GITHUB_REF_NAME#v}" "assets/symbol-mcp-server-${GITHUB_REF_NAME#v}.tgz" assets
      - name: Build provenance for the .mcpb
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*.mcpb
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --notes-file notes.md --verify-tag --title "$GITHUB_REF_NAME"

  # server.json to the MCP Registry. Runs only after publish (and therefore the npm-publish approval)
  # succeeded, alongside github-release: the Registry entry names the npm package, not the GitHub
  # Release, so a failure there does not hold it back. The Registry reads the npm version back and
  # accepts it only when its mcpName is server.json's name, so the job first waits until npm shows
  # that (scripts/wait-for-npm.sh, which release-assets.sh also uses). mcp-publisher logs in with
  # this job's GitHub OIDC token; the Registry grants io.github.<repository owner>/* for it, so no
  # Registry token or secret exists. If it fails, npm is already published: rerun this job, or
  # publish by hand (docs/RELEASING.md).
  registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token that mcp-publisher exchanges for a short-lived Registry token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Wait until npm shows the version with its mcpName
        run: |
          package=$(node -p "require('./package.json').name")
          server=$(node -p "require('./server.json').name")
          bash scripts/wait-for-npm.sh "$package@${GITHUB_REF_NAME#v}" mcpName "$server"
      # One mcp-publisher release, checked against the SHA-256 that the release's cosign-signed
      # checksums file lists. Dependabot does not update these two values; docs/RELEASING.md
      # ("Updating mcp-publisher") says how.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" mcp-publisher
          "$RUNNER_TEMP/bin/mcp-publisher" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Log in to the MCP Registry with the job's OIDC token
        run: mcp-publisher login github-oidc
      - name: Publish server.json
        run: mcp-publisher publish
      - name: Say what is left to do
        if: failure()
        run: |
          {
            echo "npm is published; only the MCP Registry entry is missing (the GitHub Release is a separate job)."
            echo "Rerun this job, or publish by hand as docs/RELEASING.md (When something fails) says."
          } >> "$GITHUB_STEP_SUMMARY"
