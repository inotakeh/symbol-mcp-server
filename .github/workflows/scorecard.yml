name: Scorecard supply-chain security

# OpenSSF Scorecard, weekly and on every push to main. Results are published to the Scorecard API
# (the README badge) and uploaded to code scanning.
on:
  schedule:
    - cron: "30 1 * * 1"   # Mondays 01:30 UTC
  push:
    branches: [main]

# Read-only by default. With publish_results, Scorecard rejects workflow-level write permissions
# and top-level or job-level env and defaults, and allows only a fixed set of actions.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # upload the SARIF results to code scanning
      id-token: write          # OIDC token that proves this run when publishing the results
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
