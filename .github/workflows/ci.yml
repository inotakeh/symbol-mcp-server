name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Jobs that need more must declare it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # SECURITY: every action is pinned to a full commit SHA, with its release tag as a comment.
      # Dependabot (github-actions ecosystem) updates the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit (high and above)
        run: npm audit --omit=dev --audit-level=high

  # Fails the PR when a new dependency carries a known vulnerability or a disallowed license.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  # Refuses PRs that touch guardrail/governance files unless opened by the maintainer.
  protected-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check protected paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MAINTAINER: inotakeh
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if echo "$changed" | grep -E '^(\.claude/|\.github/|CLAUDE\.md$|AGENTS\.md$|SECURITY\.md$|LICENSE|server\.json$|\.npmrc$)' ; then
            if [ "$AUTHOR" != "$MAINTAINER" ] && [ "$AUTHOR" != "dependabot[bot]" ]; then
              echo "::error::Protected files changed by $AUTHOR. Only $MAINTAINER may change guardrail/governance files."
              exit 1
            fi
          fi
